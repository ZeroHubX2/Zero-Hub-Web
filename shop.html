<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ร้านค้า - ZeroHub</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header" data-bg="SHOP">
      <div class="container reveal">
        <div class="label">Store</div>
        <h1>ร้านค้า</h1>
        <p>เลือกสคริปต์ที่ต้องการ ซื้อด้วยเครดิตในบัญชี</p>
      </div>
    </header>

    <section class="container">
      <div class="filters reveal" id="shopFilters" data-group>
        <button class="chip active" data-value="all">ทั้งหมด</button>
        <button class="chip" data-value="anime">แนวอนิเมะ</button>
        <button class="chip" data-value="other">อื่นๆ</button>
      </div>

      <div class="grid grid-3">
        <div class="card product reveal" data-cat="anime">
          <div class="product-thumb"><span class="hot">HOT</span><span>AZ</span></div>
          <div class="product-body">
            <div class="product-meta"><h3>Anime Zero</h3><span class="tag">ใช้งานได้</span></div>
            <p>ออโต้ฟาร์ม ออโต้สกิล ออโต้เควส</p>
            <div class="product-meta"><span class="price">79<small> ฿</small></span><button class="btn btn-primary" data-buy="Anime Zero">ซื้อเลย</button></div>
          </div>
        </div>
        <div class="card product reveal d1" data-cat="anime">
          <div class="product-thumb"><span class="hot">NEW</span><span>ASTD</span></div>
          <div class="product-body">
            <div class="product-meta"><h3>All Star Tower Defense</h3><span class="tag">ใช้งานได้</span></div>
            <p>ออโต้วางยูนิต ออโต้อัปเกรด ฟาร์มด่าน</p>
            <div class="product-meta"><span class="price">89<small> ฿</small></span><button class="btn btn-primary" data-buy="ASTD">ซื้อเลย</button></div>
          </div>
        </div>
        <div class="card product reveal d2" data-cat="other">
          <div class="product-thumb"><span>EGG</span></div>
          <div class="product-body">
            <div class="product-meta"><h3>Break and Steal an Egg</h3><span class="tag">ใช้งานได้</span></div>
            <p>ออโต้ขโมยไข่ ออโต้ขาย</p>
            <div class="product-meta"><span class="price">59<small> ฿</small></span><button class="btn btn-primary" data-buy="Break and Steal an Egg">ซื้อเลย</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
