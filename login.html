<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ - ZeroHub</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-split reveal">
      <div class="auth-side">
        <img src="mascot.webp" alt="">
        <div class="auth-side-text">
          <h2>Welcome<br><b>Back!</b></h2>
          <p>เข้าสู่ระบบเพื่อดูสคริปต์และ key ของคุณ</p>
        </div>
      </div>
      <div class="auth-card">
        <img class="auth-logo" src="logo-sm.webp" alt="">
        <h1>เข้าสู่ระบบ</h1>
        <p class="sub">กรอกข้อมูลเพื่อเข้าใช้งาน ZeroHub</p>
        <form data-demo="ตัวอย่าง: ยังไม่ได้เชื่อมระบบล็อกอิน">
          <div class="field">
            <label for="username">ชื่อผู้ใช้</label>
            <div class="input-wrap"><span>👤</span><input class="input" id="username" placeholder="Username" required></div>
          </div>
          <div class="field">
            <label for="password">รหัสผ่าน</label>
            <div class="input-wrap"><span>🔒</span><input class="input" id="password" type="password" placeholder="Password" required></div>
          </div>
          <div class="row-between">
            <label class="check"><input type="checkbox"> จดจำฉัน</label>
            <a href="contact.html">ลืมรหัสผ่าน?</a>
          </div>
          <button class="btn btn-primary btn-block btn-lg">เข้าสู่ระบบ</button>
        </form>
        <div class="divider">หรือ</div>
        <button class="btn btn-ghost btn-block" onclick="showToast('ตัวอย่าง: ยังไม่ได้เชื่อม Discord')">💬 เข้าสู่ระบบด้วย Discord</button>
        <p class="auth-foot">ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a></p>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
