<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครสมาชิก - ZeroHub</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-split reveal">
      <div class="auth-card">
        <img class="auth-logo" src="assets/logo-sm.webp" alt="">
        <h1>สมัครสมาชิก</h1>
        <p class="sub">สร้างบัญชีเพื่อซื้อและใช้งานสคริปต์</p>
        <form data-demo="ตัวอย่าง: ยังไม่ได้เชื่อมระบบสมัครสมาชิก">
          <div class="field">
            <label for="r-username">ชื่อผู้ใช้</label>
            <div class="input-wrap"><span>👤</span><input class="input" id="r-username" placeholder="Username" required></div>
          </div>
          <div class="field">
            <label for="r-email">อีเมล</label>
            <div class="input-wrap"><span>✉️</span><input class="input" id="r-email" type="email" placeholder="you@example.com" required></div>
          </div>
          <div class="field">
            <label for="r-password">รหัสผ่าน</label>
            <div class="input-wrap"><span>🔒</span><input class="input" id="r-password" type="password" placeholder="อย่างน้อย 8 ตัว" minlength="8" required></div>
          </div>
          <div class="field">
            <label for="r-confirm">ยืนยันรหัสผ่าน</label>
            <div class="input-wrap"><span>🔒</span><input class="input" id="r-confirm" type="password" placeholder="กรอกรหัสผ่านอีกครั้ง" minlength="8" required></div>
          </div>
          <div class="row-between">
            <label class="check"><input type="checkbox" required> ยอมรับเงื่อนไขการใช้งาน</label>
          </div>
          <button class="btn btn-primary btn-block btn-lg">สร้างบัญชี</button>
        </form>
        <p class="auth-foot">มีบัญชีแล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
      </div>
      <div class="auth-side">
        <img src="assets/mascot-2.webp" alt="">
        <div class="auth-side-text">
          <h2>Join<br><b>ZeroHub</b></h2>
          <p>สมัครฟรี รับสิทธิ์ทดลองใช้สคริปต์ทันที</p>
        </div>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
