<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดต่อ - ZeroHub</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header" data-bg="CONTACT">
      <div class="container reveal">
        <div class="label">Support</div>
        <h1>ติดต่อเรา</h1>
        <p>มีปัญหาหรือข้อสงสัย ทักมาได้เลย</p>
      </div>
    </header>

    <section class="container contact-grid">
      <div class="card reveal">
        <h3 style="margin-bottom:18px">ช่องทางติดต่อ</h3>
        <a class="contact-item" href="#"><div class="icon"><i class="fa-brands fa-discord"></i></div><div>Discord<small>discord.gg/your-server</small></div></a>
        <a class="contact-item" href="#"><div class="icon"><i class="fa-brands fa-facebook-f"></i></div><div>Facebook<small>ZeroHub Official</small></div></a>
        <div class="contact-item"><div class="icon"><i class="fa-regular fa-clock"></i></div><div>เวลาทำการ<small>ทุกวัน 10:00 - 24:00</small></div></div>
      </div>

      <form class="card reveal d1" data-demo="ตัวอย่าง: ยังไม่ได้เชื่อมระบบส่งข้อความ">
        <h3 style="margin-bottom:18px">ส่งข้อความถึงทีมงาน</h3>
        <div class="field">
          <label for="c-name">ชื่อ</label>
          <div class="input-wrap"><span><i class="fa-solid fa-user"></i></span><input class="input" id="c-name" placeholder="ชื่อของคุณ" required></div>
        </div>
        <div class="field">
          <label for="c-topic">หัวข้อ</label>
          <select class="input" id="c-topic">
            <option>ปัญหาการเติมเงิน</option>
            <option>สคริปต์ใช้งานไม่ได้</option>
            <option>รีเซ็ต key</option>
            <option>อื่นๆ</option>
          </select>
        </div>
        <div class="field">
          <label for="c-msg">ข้อความ</label>
          <textarea class="input" id="c-msg" placeholder="อธิบายปัญหา..." required></textarea>
        </div>
        <button class="btn btn-primary btn-block btn-lg">ส่งข้อความ</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
