<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ติดต่อ - ZeroHub</title>
  <meta name="description" content="แจ้งปัญหา เสนอแมพใหม่ หรือคุยกับทีมงานใน Discord ตลอด 24 ชั่วโมง">
  <meta name="theme-color" content="#ff1e1e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ZeroHub">
  <meta property="og:title" content="ติดต่อเรา - ZeroHub">
  <meta property="og:description" content="แจ้งปัญหา เสนอแมพใหม่ หรือคุยกับทีมงานใน Discord ตลอด 24 ชั่วโมง">
  <meta property="og:url" content="https://zerohub-oczq.onrender.com/contact">
  <meta property="og:image" content="https://zerohub-oczq.onrender.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header" data-bg="CONTACT">
      <div class="container reveal">
        <div class="label">Support</div>
        <h1>ติดต่อเรา</h1>
        <p>มีปัญหาหรือข้อสงสัย ทักมาได้เลย</p>
      </div>
    </header>

    <section class="container contact-grid">
      <div class="card reveal">
        <h3 style="margin-bottom:18px">ช่องทางติดต่อ</h3>
        <a class="contact-item" href="https://discord.gg/CYxyhhBNba" target="_blank" rel="noopener"><div class="icon"><i class="fa-brands fa-discord"></i></div><div>Discord<small>discord.gg/CYxyhhBNba</small></div></a>
        <div class="contact-item"><div class="icon"><i class="fa-regular fa-clock"></i></div><div>เวลาทำการ<small>ตลอด 24 ชั่วโมง ทุกวัน</small></div></div>
      </div>

      <form class="card reveal d1" id="contactForm" novalidate>
        <h3 style="margin-bottom:18px">ส่งข้อความถึงทีมงาน</h3>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="field">
          <label for="c-name">ชื่อ</label>
          <div class="input-wrap"><span><i class="fa-solid fa-user"></i></span><input class="input" id="c-name" name="name" placeholder="ชื่อของคุณ" maxlength="50" required></div>
        </div>
        <div class="field">
          <label for="c-topic">หัวข้อ</label>
          <select class="input" id="c-topic" name="topic">
            <option>สคริปต์ใช้งานไม่ได้</option>
            <option>เสนอแมพใหม่</option>
            <option>เสนอฟีเจอร์</option>
            <option>อื่นๆ</option>
          </select>
        </div>
        <div class="field">
          <label for="c-msg">ข้อความ</label>
          <textarea class="input" id="c-msg" name="message" placeholder="อธิบายปัญหา..." minlength="5" maxlength="1000" required></textarea>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-paper-plane"></i><span>ส่งข้อความ</span></button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
